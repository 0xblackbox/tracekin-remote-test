name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python3 -m py_compile plugins/tracekin/scripts/*.py plugins/tracekin/scripts/tracekin_lib/*.py
      - name: Manifests are valid JSON
        run: |
          for f in plugins/tracekin/.codex-plugin/plugin.json plugins/tracekin/.claude-plugin/plugin.json plugins/tracekin/.cursor-plugin/plugin.json plugins/tracekin/hooks/hooks.json plugins/tracekin/cursor/hooks.json plugins/tracekin/.mcp.json plugins/tracekin/codex/mcp.json plugins/tracekin/cursor/mcp.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json gemini-extension.json hooks/hooks.json plugins/tracekin/opencode/package.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
      - name: OpenCode plugin syntax
        run: node --check plugins/tracekin/opencode/tracekin.js
      - name: Unit tests
        run: python3 plugins/tracekin/scripts/test_tracekin.py
      - name: Integration smoke
        run: python3 plugins/tracekin/scripts/integration_smoke.py
